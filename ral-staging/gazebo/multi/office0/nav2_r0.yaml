/r0/behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - wait
    enable_stamped_cmd_vel: false
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    robot_base_frame: base_link
    spin:
      plugin: nav2_behaviors::Spin
    use_sim_time: true
    wait:
      plugin: nav2_behaviors::Wait
/r0/bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 20
    global_frame: map
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    odom_topic: odom
    robot_base_frame: base_link
    use_sim_time: true
/r0/controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 1.0
      desired_linear_vel: 1.5
      lookahead_dist: 1.5
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 3.2
      max_lookahead_dist: 3.0
      min_approach_linear_velocity: 0.1
      min_lookahead_dist: 0.6
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      rotate_to_heading_angular_vel: 1.8
      rotate_to_heading_min_angle: 0.785
      transform_tolerance: 0.2
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: true
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: false
    failure_tolerance: 0.5
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 6.28
    goal_checker_plugins:
    - goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
    progress_checker_plugins:
    - progress_checker
    use_sim_time: true
/r0/global_costmap/global_costmap:
  ros__parameters:
    global_frame: map
    inflation_layer:
      cost_scaling_factor: 3.0
      inflation_radius: 0.8
      plugin: nav2_costmap_2d::InflationLayer
    plugins:
    - static_layer
    - inflation_layer
    publish_frequency: 1.0
    resolution: 0.25
    robot_base_frame: base_link
    robot_radius: 0.35
    static_layer:
      map_subscribe_transient_local: true
      plugin: nav2_costmap_2d::StaticLayer
    track_unknown_space: false
    update_frequency: 1.0
    use_sim_time: true
/r0/lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names:
    - map_server
    - planner_server
    - controller_server
    - behavior_server
    - bt_navigator
    use_sim_time: true
/r0/local_costmap/local_costmap:
  ros__parameters:
    global_frame: odom
    height: 8
    inflation_layer:
      cost_scaling_factor: 3.0
      inflation_radius: 0.8
      plugin: nav2_costmap_2d::InflationLayer
    plugins:
    - static_layer
    - inflation_layer
    publish_frequency: 2.0
    resolution: 0.25
    robot_base_frame: base_link
    robot_radius: 0.35
    rolling_window: true
    static_layer:
      map_subscribe_transient_local: true
      plugin: nav2_costmap_2d::StaticLayer
    update_frequency: 5.0
    use_sim_time: true
    width: 8
/r0/map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/claude/gz/multi/office0/maps/map.yaml
/r0/planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    use_sim_time: true
